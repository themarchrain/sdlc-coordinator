# 多实例隔离部署样例：MySQL（共享状态）+ nginx（LB）+ 2 Coordinator + 2 Runner。
#
# 隔离红线：
# - 两个 Coordinator 不挂任何共享文件卷（平台库/控制面库/租户库全部在 MySQL）。
# - 两个 Runner 各自独占命名卷（runner-a-data / runner-b-data），互不可见。
# - Runner 不经 LB：每个 Runner 只被本机 Coordinator 与池指派寻址。
#
# 启动前置：先按 README 构建两个镜像（sdlc-coordinator / sdlc-agent-runner），
# 假 CLI 投放见 deploy/agent-runner-runtime/README.md 与本目录 README。
#
# 环境注入（不要把真实值写进仓库；通用占位值见 README）：
#   MULTI_SECRET        部署级共享密钥（hex 64）：RESULT_CHANNEL_SECRET 与
#                       AGENT_RUNNER_INTERNAL_TOKEN 共用同一值。
#   MULTI_MYSQL_PASSWORD MySQL root 密码占位（样例内默认仅本机联调用）。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${MULTI_MYSQL_PASSWORD:-multi-root-pass}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --max_connections=200
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动建平台库与控制面库（协调器只自动开通租户库，不建这两库）。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MULTI_MYSQL_PASSWORD:-multi-root-pass}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - multi-net

  coordinator-a:
    image: sdlc-coordinator:${MULTI_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      COORDINATOR_HTTP_ADDR: ":8080"
      # 共享状态：平台库/控制面库同库（控制面库可拆，样例从简）。
      COORDINATOR_DATABASE_DSN: "mysql://root:${MULTI_MYSQL_PASSWORD:-multi-root-pass}@mysql:3306/sdlc_platform"
      CONTROL_PLANE_DSN: "mysql://root:${MULTI_MYSQL_PASSWORD:-multi-root-pass}@mysql:3306/sdlc_control_plane"
      CONTROL_PLANE_SUPERADMIN_USERNAME: "${MULTI_SUPERADMIN_USERNAME:-superadmin}"
      CONTROL_PLANE_SUPERADMIN_PASSWORD: "${MULTI_SUPERADMIN_PASSWORD:-multi-super-pass}"
      PORTAL_COOKIE_SECURE: "${MULTI_PORTAL_COOKIE_SECURE:-true}"
      COORDINATOR_LOG_LEVEL: info
      COORDINATOR_LOG_DIR: /app/logs
      COORDINATOR_ENVIRONMENT: production
      GIN_MODE: release
      # 远端工作区形态（多实例部署前提）：三件强制配置缺一拒启。
      AGENT_RUNNER_REMOTE_WORKSPACE: "true"
      RESULT_CHANNEL_SECRET: "${MULTI_SECRET:?set MULTI_SECRET to a 64-char hex string}"
      AGENT_RUNNER_INTERNAL_TOKEN: "${MULTI_SECRET:?set MULTI_SECRET to a 64-char hex string}"
      # 默认 runner 端点：本实例同侧 runner（未指派租户回退此池）。
      AGENT_RUNNER_SERVICE_URL: "http://runner-a:8081"
      AGENT_RUNNER_WORKSPACE_ROOT: "/app/workspaces"
      AGENT_RUNNER_PROVIDER: "codex-cli"
    volumes:
      - coordinator-a-logs:/app/logs
    networks:
      - multi-net

  coordinator-b:
    image: sdlc-coordinator:${MULTI_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      COORDINATOR_HTTP_ADDR: ":8080"
      COORDINATOR_DATABASE_DSN: "mysql://root:${MULTI_MYSQL_PASSWORD:-multi-root-pass}@mysql:3306/sdlc_platform"
      CONTROL_PLAIN_DSN_UNUSED: ""
      CONTROL_PLANE_DSN: "mysql://root:${MULTI_MYSQL_PASSWORD:-multi-root-pass}@mysql:3306/sdlc_control_plane"
      CONTROL_PLANE_SUPERADMIN_USERNAME: "${MULTI_SUPERADMIN_USERNAME:-superadmin}"
      CONTROL_PLANE_SUPERADMIN_PASSWORD: "${MULTI_SUPERADMIN_PASSWORD:-multi-super-pass}"
      PORTAL_COOKIE_SECURE: "${MULTI_PORTAL_COOKIE_SECURE:-true}"
      COORDINATOR_LOG_LEVEL: info
      COORDINATOR_LOG_DIR: /app/logs
      COORDINATOR_ENVIRONMENT: production
      GIN_MODE: release
      AGENT_RUNNER_REMOTE_WORKSPACE: "true"
      RESULT_CHANNEL_SECRET: "${MULTI_SECRET:?set MULTI_SECRET to a 64-char hex string}"
      AGENT_RUNNER_INTERNAL_TOKEN: "${MULTI_SECRET:?set MULTI_SECRET to a 64-char hex string}"
      # 运行配置存入共享 MySQL；首次向导保存的默认地址会由双副本共用。
      AGENT_RUNNER_SERVICE_URL: "http://runner-a:8081"
      AGENT_RUNNER_WORKSPACE_ROOT: "/app/workspaces"
      AGENT_RUNNER_PROVIDER: "codex-cli"
    volumes:
      - coordinator-b-logs:/app/logs
    networks:
      - multi-net

  runner-a:
    image: sdlc-agent-runner:${MULTI_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      AGENT_RUNNER_HTTP_ADDR: ":8081"
      AGENT_RUNNER_DATA_ROOT: /app/runner-data
      AGENT_RUNNER_CODEX_BINARY: /opt/codex/bin/codex
      # 受控工作区通道：与协调器共享同一部署级令牌。
      AGENT_RUNNER_INTERNAL_TOKEN: "${MULTI_SECRET:?set MULTI_SECRET to a 64-char hex string}"
      # 状态改变类操作的授权确认入口：指向 LB（任一协调器副本都能基于
      # 共享库裁决当前归属）。
      AGENT_RUNNER_AUTHORIZATION_URL: "http://lb:80/runner-authorization"
    volumes:
      - runner-a-data:/app/runner-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - multi-net

  runner-b:
    image: sdlc-agent-runner:${MULTI_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      AGENT_RUNNER_HTTP_ADDR: ":8081"
      AGENT_RUNNER_DATA_ROOT: /app/runner-data
      AGENT_RUNNER_CODEX_BINARY: /opt/codex/bin/codex
      AGENT_RUNNER_INTERNAL_TOKEN: "${MULTI_SECRET:?set MULTI_SECRET to a 64-char hex string}"
      AGENT_RUNNER_AUTHORIZATION_URL: "http://lb:80/runner-authorization"
    volumes:
      - runner-b-data:/app/runner-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - multi-net

  lb:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - coordinator-a
      - coordinator-b
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MULTI_LB_PORT:-8090}:80"
    networks:
      - multi-net

volumes:
  mysql-data:
  coordinator-a-logs:
  coordinator-b-logs:
  runner-a-data:
  runner-b-data:

networks:
  multi-net:
    name: ${MULTI_NET_NAME:-sdlc-multi-net}
