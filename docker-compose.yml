services:
  coordinator:
    image: sdlc-coordinator:${TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      COORDINATOR_HTTP_ADDR: ":8080"
      COORDINATOR_DATABASE_DSN: "file:/app/data/sdlc-coordinator.db?_foreign_keys=on&_busy_timeout=5000"
      COORDINATOR_LOG_LEVEL: info
      COORDINATOR_LOG_DIR: /app/logs
      COORDINATOR_ENVIRONMENT: production
      CONTROL_PLANE_DSN: "file:/app/data/control-plane.db?_foreign_keys=on&_busy_timeout=5000"
      CONTROL_PLANE_SUPERADMIN_USERNAME: "${CONTROL_PLANE_SUPERADMIN_USERNAME:-}"
      CONTROL_PLANE_SUPERADMIN_PASSWORD: "${CONTROL_PLANE_SUPERADMIN_PASSWORD:-}"
      GIN_MODE: release
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./workspaces:/app/workspaces
    ports:
      - "${COORDINATOR_PUBLIC_PORT:-8080}:8080"
    networks:
      - ai-sdlc

  agent-runner:
    image: sdlc-agent-runner:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.agent-runner
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      AGENT_RUNNER_HTTP_ADDR: ":8081"
      AGENT_RUNNER_DATA_ROOT: /app/runner-data
      AGENT_RUNNER_CODEX_BINARY: /opt/codex/bin/codex
    volumes:
      - ./workspaces:/app/workspaces
      - ./runner-data:/app/runner-data
    healthcheck:
      # alpine 基底无 curl；busybox wget 即可。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-sdlc

networks:
  ai-sdlc:
    external: true
    name: ${GROUP_NAMESPACE:-sdlc-net}
