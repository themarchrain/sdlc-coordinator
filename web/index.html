<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#152033" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Coordinator Control Room</title>
    <script>
      // 首屏防闪烁：React 加载前根据 localStorage 主题设置 data-theme。
      // 与 src/themes/registry.ts、src/theme/ThemeProvider.tsx 同 key 同回退逻辑；
      // id 清单无法共享（此处不可引入模块），新增主题时需同步维护。
      ;(function () {
        var THEME_KEY = 'coordinator-theme'
        var VALID_THEMES = ['default', 'apple', 'claude', 'minimax', 'supabase', 'vercel', 'xai', 'cursor', 'ollama', 'voltagent', 'nintendo-2001', 'dell-1996', 'tesla', 'nike', 'theverge', 'bmw-m', 'discord', 'spotify', 'framer', 'elevenlabs', 'raycast', 'stripe', 'lamborghini', 'resend', 'revolut', 'sentry', 'shopify', 'kraken', 'warp', 'composio', 'clickhouse', 'sanity', 'bugatti', 'binance', 'ferrari', 'hashicorp', 'linear', 'renault', 'slack', 'mintlify', 'together', 'mistral', 'expo', 'lovable', 'mastercard', 'starbucks', 'meta', 'vodafone', 'wired', 'notion', 'airbnb', 'clay', 'figma', 'playstation', 'posthog', 'spacex', 'hp', 'ibm', 'superhuman', 'runway', 'pinterest', 'coinbase', 'cal', 'airtable', 'mongodb', 'miro', 'replicate', 'webflow', 'wise', 'mobbin', 'opencode', 'bmw', 'uber', 'intercom', 'zapier', 'cohere', 'nvidia']
        var DARK_BACKGROUNDS = { xai: '#0a0a0a', voltagent: '#101010', theverge: '#131313', 'bmw-m': '#000000', discord: '#0a0d3a', spotify: '#121212', framer: '#090909', raycast: '#07080a', lamborghini: '#000000', resend: '#000000', revolut: '#000000', sentry: '#1f1633', warp: '#2b2622', composio: '#0f0f0f', clickhouse: '#0a0a0a', sanity: '#0b0b0b', bugatti: '#000000', binance: '#0b0e11', ferrari: '#181818', hashicorp: '#000000', linear: '#010102', spacex: '#000000' }
        var stored = null
        try { stored = localStorage.getItem(THEME_KEY) } catch (error) { /* localStorage 不可用时回退 default */ }
        var theme = VALID_THEMES.indexOf(stored) !== -1 ? stored : 'default'
        document.documentElement.dataset.theme = theme
        var darkBackground = DARK_BACKGROUNDS[theme]
        if (darkBackground) {
          document.documentElement.style.background = darkBackground
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', darkBackground)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
